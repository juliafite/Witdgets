<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloj de Júlia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Nunito:wght@500;600;700&display=swap">
<style>
/* Widget para incrustar en Notion: tarjeta única, centrada, azul cielo. Un solo tema claro a propósito. */
:root {
  --sky: #a98163;
  --sky-deep: #8f6a4d;
  --card: #b8926f;
  --ink: #fdf6ee;
  --ink-soft: #ecdcc8;
  --accent: #f3dfc6;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
}
.clock {
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, var(--card), var(--sky-deep));
  border-radius: 14px;
  padding: 16px;
  box-sizing: border-box;
  text-align: center;
  display: grid;
  align-content: center;
  gap: 10px;
}
.greeting {
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.time {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(3.4rem, 17vw, 5.6rem);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.time .sec {
  font-size: .32em;
  color: var(--accent);
  font-weight: 400;
  margin-left: .15em;
  vertical-align: .9em;
}
.colon { color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .colon { animation: none; } }
.date {
  font-size: 1.05rem;
  font-weight: 600;
  text-transform: capitalize;
}
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--sky-deep); }
.dots span.on { background: var(--accent); }
</style>

</head>
<body>
<div class="clock" role="timer" aria-live="off">
  <div class="greeting" id="greeting">Buenas tardes</div>
  <div class="time"><span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="sec" id="ss">00</span></div>
  <div class="date" id="date">martes, 13 de octubre</div>
  <div class="dots" id="dots" aria-hidden="true"></div>
</div>

<script>
const pad = n => String(n).padStart(2, "0");
const fmt = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const dots = document.getElementById("dots");
const days = ["L","M","X","J","V","S","D"];
for (let i = 0; i < 7; i++) { const s = document.createElement("span"); s.title = days[i]; dots.appendChild(s); }

function tick() {
  const d = new Date();
  const h = d.getHours();
  document.getElementById("hh").textContent = pad(h);
  document.getElementById("mm").textContent = pad(d.getMinutes());
  document.getElementById("ss").textContent = pad(d.getSeconds());
  document.getElementById("date").textContent = fmt.format(d);
  document.getElementById("greeting").textContent =
    h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches";
  const idx = (d.getDay() + 6) % 7;
  [...dots.children].forEach((s, i) => s.classList.toggle("on", i === idx));
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
